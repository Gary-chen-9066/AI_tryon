<!DOCTYPE html>
<html>
<head>
    <title>AI Try-On</title>
</head>

<body>

    <h1>AI Try-On</h1>

    <form method="POST" enctype="multipart/form-data">

        <h2>你的照片</h2>
        <input type="file" name="user_image" accept="image/*">

        <h2>衣服照片</h2>
        <input type="file" name="clothes_image" accept="image/*">

        <br><br>

        <button type="submit">開始試穿</button>

    </form>

{% if user_image and clothes_image %}

    <h2>你的照片</h2>
    <img src="{{ url_for('uploaded_file', filename=user_image.split('/')[-1]) }}" width="300">

    <h2>衣服照片</h2>
    <img src="{{ url_for('uploaded_file', filename=clothes_image.split('/')[-1]) }}" width="300">

{% endif %}

</body>
</html>
